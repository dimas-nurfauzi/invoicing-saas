name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Lint (Spotless)
        run: ./mvnw -B spotless:check

      - name: Build and test
        run: ./mvnw -B verify

  docker:
    # The image must build from a commit that passed the tests. Built only, not pushed:
    # pushing to a registry comes with deployment.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: invoicing-saas:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
