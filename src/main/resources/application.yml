spring:
  application:
    name: invoicing-saas
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/invoicing}
    username: ${DB_USERNAME:invoicing}
    password: ${DB_PASSWORD:invoicing}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # Required, no default: HMAC-SHA256 key, at least 32 bytes. See .env.example.
    secret: ${JWT_SECRET}
    ttl: ${JWT_TTL:PT1H}
    issuer: invoicing-saas
  # Browser origins allowed to call the tenant API cross-origin (comma-separated exact origins,
  # e.g. http://localhost:5173). Empty = CORS off. The platform API never allows CORS.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  # Public self-service signup (POST /api/tenants). false = only platform admins create tenants.
  tenant-signup-enabled: ${TENANT_SIGNUP_ENABLED:true}
  # Daily job marking SENT invoices past their due date as OVERDUE. cron "-" disables it.
  overdue:
    cron: "${OVERDUE_CRON:0 5 0 * * *}"
    zone: ${OVERDUE_ZONE:Asia/Jakarta}
  # AI invoice drafts (Claude API). Without ANTHROPIC_API_KEY the endpoint answers 503.
  ai:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${AI_MODEL:claude-opus-5-5}
    effort: ${AI_EFFORT:low}
    max-tokens: 16000
    timeout: 60s
    max-attempts: 3
  # First platform admin, created at startup if both are set. No default account.
  platform-admin:
    email: ${PLATFORM_ADMIN_EMAIL:}
    password: ${PLATFORM_ADMIN_PASSWORD:}

springdoc:
  # Swagger UI at /swagger-ui.html, spec at /v3/api-docs. Set SPRINGDOC_ENABLED=false in production.
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    persist-authorization: true

logging:
  pattern:
    # request_id / tenant_id / user_id from the MDC on every line (RequestIdFilter, TenantContextFilter).
    level: "%5p [req=%X{request_id:-} tenant=%X{tenant_id:-} user=%X{user_id:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
