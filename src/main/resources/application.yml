spring:
  application:
    name: invoicing-saas
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/invoicing}
    username: ${DB_USERNAME:invoicing}
    password: ${DB_PASSWORD:invoicing}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
