spring:
  application:
    name: invoicing-saas
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/invoicing}
    username: ${DB_USERNAME:invoicing}
    password: ${DB_PASSWORD:invoicing}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # Required, no default: HMAC-SHA256 key, at least 32 bytes. See .env.example.
    secret: ${JWT_SECRET}
    ttl: ${JWT_TTL:PT1H}
    issuer: invoicing-saas

springdoc:
  # Swagger UI at /swagger-ui.html, spec at /v3/api-docs. Set SPRINGDOC_ENABLED=false in production.
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    persist-authorization: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
