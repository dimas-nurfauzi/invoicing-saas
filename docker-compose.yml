services:
  postgres:
    image: postgres:17-alpine
    container_name: invoicing-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-invoicing}
      POSTGRES_USER: ${POSTGRES_USER:-invoicing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invoicing}
    ports:
      # 5433 on the host so it doesn't clash with another local PostgreSQL on 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - invoicing-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Full stack: `docker compose --profile app up --build`. Not started by a plain
  # `docker compose up -d`, which keeps running only PostgreSQL for local development.
  app:
    profiles: ["app"]
    build: .
    image: invoicing-saas:local
    container_name: invoicing-app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the compose network the database is `postgres:5432`, not localhost:5433.
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-invoicing}
      DB_USERNAME: ${POSTGRES_USER:-invoicing}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-invoicing}
      # From .env or the shell. Required: the app refuses to start without it.
      JWT_SECRET: ${JWT_SECRET:-}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  invoicing-pgdata:
